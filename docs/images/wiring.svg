<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<rect width="1000" height="720" fill="#f8fafc"/>
<title>SSD1306 OLED to Raspberry Pi 3B+ wiring</title>
<desc>GND to physical pin 6, VCC to pin 1 at 3.3 volts, SCL to pin 5, SDA to pin 3. Top view, identify pin 1 before connecting.</desc>
